name: Audit Durable WINTICKET Backups
on:
  push:
    paths:
      - ".github/workflows/audit-winticket-storage.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify encrypted daily archives are present in monthly Releases
        run: python scripts/audit_winticket_storage.py
      - name: Publish metadata-only verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/winticket_storage_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified durable WINTICKET training backups"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
