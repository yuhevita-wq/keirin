name: Nyanta holdout official payouts
on:
  push:
    branches: [rebuild/nyanta-data-audit]
    paths: [.github/workflows/nyanta-holdout-payoffs.yml]
permissions:
  contents: write
env:
  KEIRIN_ALLOW_SQLITE_FALLBACK: "1"
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        month: ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuhevita-wq/kiseki
          ref: 1405d0253a037f9880c3739b796b32b72135700d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pandas==2.2.1 numpy==1.26.4
      - name: Read verified corpus, reuse first pilot's payouts in October
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ matrix.month }}
        run: |
          gh release download nyanta-verified-checkpoint-40052323240 --repo yuhevita-wq/keirin --pattern nyanta-core.sqlite.gpg --dir checkpoint
          if [ "$MONTH" = 2026-10 ]; then
            gh release download nyanta-official-payouts-40052449816 --repo yuhevita-wq/keirin --pattern "*.gpg" --dir prior
          fi
      - name: Original official payout collector, no odds or entries recollection
        env:
          COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
          MONTH: ${{ matrix.month }}
        run: |
          cmd=(python -u keirin/scripts/reconstruct_payoffs.py --month "$MONTH" --checkpoint checkpoint/nyanta-core.sqlite.gpg --output results)
          if [ "$MONTH" = 2026-10 ]; then cmd+=(--resume prior/official-payoffs-2026-10.sqlite.gpg); fi
          "${cmd[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyanta-official-payoffs-${{ matrix.month }}-${{ github.run_id }}
          path: |
            results/*.json
            results/*.gpg
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve encrypted payout checkpoint and aggregate progress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ matrix.month }}
        run: |
          if compgen -G "results/*.gpg" >/dev/null; then
            tag="nyanta-official-payoffs-$MONTH-${{ github.run_id }}"
            gh release create "$tag" --repo yuhevita-wq/keirin --title "$tag" --notes "Original collector. Aggregate report states whether the month is complete; encrypted checkpoints support resumption."
            gh release upload "$tag" results/*.json results/*.gpg --repo yuhevita-wq/keirin
          fi
