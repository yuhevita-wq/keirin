name: Nyanta one-race read-only reconstruction diagnostic
'on':
  push:
    branches: [rebuild/nyanta-data-audit]
    paths: [.github/workflows/nyanta-one-race-diff.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuhevita-wq/kiseki
          ref: e8252a17e22b95b85b2c143616df4b553eeffb47
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report encryption dependency
        run: python -m pip install cryptography
      - uses: actions/download-artifact@v4
        with:
          name: nyanta-original-probability-comparison-40055616264
          run-id: 40055616264
          github-token: ${{ github.token }}
          path: probability
      - name: Download saved encrypted reconstruction rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nyanta-runtime-pilot-40056158936 --repo yuhevita-wq/keirin --pattern runtime-rows.json.gpg --dir runtime
      - name: Compare Hofu 1R using actual stored records; encrypt detail
        env:
          COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
        run: |
          python - <<'PY'
          """Compare one real race without changing any Nyanta calculation path."""
          from __future__ import annotations
          import base64
          import gzip
          import json
          import os
          import tempfile
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          
          from keirin.scripts.reconstruct_core import crypt
          
          RACE_KEY = "20261023_63_01"
          
          def parsed_legs(row):
              if not row:
                  return []
              legs = row.get("legs") or []
              return json.loads(legs) if isinstance(legs, str) else legs
          
          def selected_legs(row):
              return [
                  {"combo": str(l["combo"]), "stake": int(l["stake"]),
                   "pred_odds": (None if l.get("pred_odds") is None else float(l["pred_odds"]))}
                  for l in parsed_legs(row)
              ]
          
          def pack_b64(data):
              return base64.b64encode(data).decode("ascii")
          
          with tempfile.TemporaryDirectory(prefix="nyanta-one-race-") as directory:
              tmp = Path(directory)
              runtime_path = tmp / "runtime.json"
              frozen_path = tmp / "probabilities.json"
              runtime_sources = list(Path("runtime").rglob("runtime-rows.json.gpg"))
              probability_sources = list(Path("probability").rglob("*.rows.json.gpg"))
              if len(runtime_sources) != 1 or len(probability_sources) != 1:
                  raise RuntimeError("required_encrypted_actual_artifact_missing_or_ambiguous")
              crypt(runtime_sources[0], runtime_path, decrypt=True)
              crypt(probability_sources[0], frozen_path, decrypt=True)
              runtime = json.loads(runtime_path.read_text())
              comparison = json.loads(frozen_path.read_text())
              reference = json.loads(gzip.decompress(
                  Path("keirin/reconstruction/original_reference_20261023.json.gz").read_bytes()
              ))
          
          displayed = next(
              (r for r in reference["data"]["displayed"] if r["race_key"] == RACE_KEY), None
          )
          if displayed is None:
              raise RuntimeError("original_race_missing")
          original_picks = [
              r for r in reference["data"]["type_lab"]["picks"] if r["race_key"] == RACE_KEY
          ]
          if not original_picks:
              raise RuntimeError("original_plan_rows_missing")
          orig_plan_key = displayed.get("type_lab_plan")
          orig_plan_row = next((r for r in original_picks if r["plan_key"] == orig_plan_key), None)
          accepted = [r for r in runtime.get("accepted", []) if r["race_key"] == RACE_KEY]
          if len(accepted) > 1:
              raise RuntimeError("multiple_reconstructed_adoptions")
          adopted_row = accepted[0] if accepted else None
          candidates = [r for r in runtime.get("candidates", []) if r["race_key"] == RACE_KEY]
          same_plan = next((r for r in candidates if r["plan_key"] == orig_plan_key), None)
          chosen = adopted_row or same_plan or (candidates[0] if candidates else None)
          if not chosen:
              raise RuntimeError("reconstructed_race_not_present_in_candidates")
          raw_probabilities = {
              (int(x["frame_no"]), x["kind"]): x
              for x in comparison["probabilities"] if x["race_key"] == RACE_KEY
          }
          if len(raw_probabilities) != 14:
              raise RuntimeError("reconstructed_probability_rows_incomplete")
          probabilities = []
          for entry in sorted(displayed["entries"], key=lambda e: int(e["frame_no"])):
              car = int(entry["frame_no"])
              w = raw_probabilities[(car, "win")]
              t = raw_probabilities[(car, "top3")]
              if (abs(float(w["reference_pct"]) - float(entry["pred_win_pct"])) > 1e-8
                      or abs(float(t["reference_pct"]) - float(entry["pred_top3_pct"])) > 1e-8):
                  raise RuntimeError("original_reference_probability_source_disagrees")
              probabilities.append({
                  "car": car,
                  "original_win_pct": float(w["reference_pct"]),
                  "rebuilt_win_pct": round(float(w["reconstructed_pct"]), 6),
                  "delta_win_pp": round(float(w["delta_pp"]), 6),
                  "original_top3_pct": float(t["reference_pct"]),
                  "rebuilt_top3_pct": round(float(t["reconstructed_pct"]), 6),
                  "delta_top3_pp": round(float(t["delta_pp"]), 6)
              })
          
          original_actual_legs = [
              {"combo": str(l["combo"]), "stake": int(l["stake"]),
               "pred_odds_display": float(l["odds"])}
              for l in ((displayed.get("submitted_bet") or {}).get("lines") or [])
          ]
          orig_pred_odds = {
              str(l["combo"]): float(l["pred_odds"]) for l in parsed_legs(orig_plan_row)
          }
          for l in original_actual_legs:
              l["pred_odds"] = orig_pred_odds.get(l["combo"], l["pred_odds_display"])
          rebuild_legs = selected_legs(adopted_row)
          rebuild_candidate_legs = selected_legs(same_plan)
          original_by_combo = {l["combo"]: l for l in original_actual_legs}
          rebuilt_by_combo = {l["combo"]: l for l in rebuild_legs}
          comparison_legs = [
              {"combo": combo,
               "original_stake": original_by_combo.get(combo, {}).get("stake"),
               "rebuilt_stake": rebuilt_by_combo.get(combo, {}).get("stake"),
               "original_pred_odds": original_by_combo.get(combo, {}).get("pred_odds"),
               "rebuilt_pred_odds": rebuilt_by_combo.get(combo, {}).get("pred_odds")}
              for combo in sorted(set(original_by_combo) | set(rebuilt_by_combo))
          ]
          report = {
              "comparison_kind": "retrospective_non_identical_asof",
              "race_key": RACE_KEY,
              "race_date": "2026-10-23",
              "original_reference_captured_at": reference["captured_at"],
              "reconstructed_replay_clock": "2026-10-23 07:20 JST",
              "probabilities": probabilities,
              "shape": {
                  "original_type": displayed.get("type_lab_type"),
                  "rebuilt_type": chosen["type_label"],
                  "original_axis": [orig_plan_row["axis1"], orig_plan_row["axis2"]] if orig_plan_row else None,
                  "rebuilt_axis": [chosen["axis1"], chosen["axis2"]],
                  "original_axis_sum": orig_plan_row.get("axis_sum") if orig_plan_row else None,
                  "rebuilt_axis_sum": chosen.get("axis_sum"),
                  "original_arare": orig_plan_row.get("arare") if orig_plan_row else None,
                  "rebuilt_arare": chosen.get("arare")
              },
              "purchase": {
                  "original_adopted": bool(displayed["sold"]),
                  "rebuilt_adopted": bool(adopted_row),
                  "original_plan": orig_plan_key,
                  "rebuilt_plan": adopted_row.get("plan_key") if adopted_row else None,
                  "rebuilt_original_plan_candidate_found": same_plan is not None,
                  "original_legs": original_actual_legs,
                  "rebuilt_legs": rebuild_legs,
                  "rebuilt_original_plan_candidate_legs": rebuild_candidate_legs,
                  "legs_comparison": comparison_legs,
                  "original_total_stake": sum(x["stake"] for x in original_actual_legs),
                  "rebuilt_total_stake": sum(x["stake"] for x in rebuild_legs),
                  "combos_match": set(original_by_combo) == set(rebuilt_by_combo) if adopted_row else False,
                  "all_stakes_match": {k: x["stake"] for k,x in original_by_combo.items()} == {k: x["stake"] for k,x in rebuilt_by_combo.items()} if adopted_row else False,
                  "reconstructed_skips": [
                      {"plan_key": r.get("plan_key"), "reason": r.get("reason")}
                      for r in runtime.get("skips", []) if r.get("race_key") == RACE_KEY
                  ]
              },
              "warning": "Captured public display may be post-issuance; original morning behind and original trained model weights are not proven identical."
          }
          serialized = json.dumps(report, ensure_ascii=False, separators=(",", ":")).encode()
          public_key = serialization.load_pem_public_key("""-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtEe6xrFAl1JSiorA6Jqx
          yn6zZr8YvlWRbH8CbLNl7ee3LlGnuZs601RhKT8q5ctzbs3UMf2nzHHvuImjs3aL
          pfOm2wRNdhPVnEKC3zKq6IaG6ZvzSLAVK8Tczufu/DLHiyx0BdkF6NUgu19F/ss1
          X/hYAJUzHjQWLmQ6QWYQKNFFx+Zem8F2QWJXMvuRNfDlZKKelV5SnbGw+y4G2zEA
          7H+f0JY+8Avy8O7qSuMA76IzLn1XVzSDST7+w9A8SH9qKGkVaCxYxjldTs8Gyqb7
          EKTmXVecH1xDmEL0b4xgE0Yh9bHwobz5zOyZ3h44MhWZasziWfn4bA0gntJy3AU9
          HwIDAQAB
          -----END PUBLIC KEY-----""".encode())
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, serialized, None)
          wrapped = public_key.encrypt(aes_key, padding.OAEP(
              mgf=padding.MGF1(algorithm=hashes.SHA256()),
              algorithm=hashes.SHA256(), label=None))
          envelope = {"alg": "RSA-OAEP-SHA256+AES-256-GCM",
                      "wrapped_key": pack_b64(wrapped), "nonce": pack_b64(nonce),
                      "ciphertext": pack_b64(ciphertext)}
          Path("results").mkdir(exist_ok=True)
          Path("results/one-race-diff.encrypted.json").write_text(json.dumps(envelope))
          print("NYANTA_ENCRYPTED_ONE_RACE=" + pack_b64(json.dumps(envelope).encode()))
          print("Nyanta one-race diagnostic completed; detailed report encrypted for one-time reviewer.")
          
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nyanta-one-race-diff-${{ github.run_id }}
          path: results/one-race-diff.encrypted.json
          if-no-files-found: error
