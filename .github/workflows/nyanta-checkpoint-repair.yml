name: Nyanta checkpoint roundtrip repair
on:
  push:
    branches: [rebuild/nyanta-data-audit]
    paths: [.github/workflows/nyanta-checkpoint-repair.yml]
permissions:
  contents: write
env:
  KEIRIN_ALLOW_SQLITE_FALLBACK: "1"
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuhevita-wq/kiseki
          ref: 318972318d6e7191c29c33ff30c0cbf488e9bb83
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.1 numpy==1.26.4
      - name: Resume existing encrypted checkpoint and reconcile source day counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download nyanta-core-checkpoint-40050812352 --repo yuhevita-wq/keirin --dir checkpoint
      - name: Repair missing checkpoint days and prove encrypted roundtrip counts
        env:
          COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: python -u keirin/scripts/reconstruct_core.py prepare --checkpoint checkpoint/nyanta-core.sqlite.gpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyanta-verified-checkpoint-${{ github.run_id }}
          path: |
            checkpoint/*.gpg
            checkpoint/*.json
      - name: Preserve verified encrypted checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nyanta-verified-checkpoint-${{ github.run_id }}"
          gh release create "$tag" --repo yuhevita-wq/keirin --title "$tag" --notes "WAL-aware SQLite backup. Counts verified after encryption/decryption."
          gh release upload "$tag" checkpoint/*.gpg checkpoint/*.json --repo yuhevita-wq/keirin
