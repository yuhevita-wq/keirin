name: Nyanta original trifecta odds training
on:
  push:
    branches: [rebuild/nyanta-data-audit]
    paths: [.github/workflows/nyanta-original-odds.yml]
permissions:
  contents: write
  actions: read
env:
  KEIRIN_ALLOW_SQLITE_FALLBACK: "1"
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
jobs:
  await-original-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require actual original-input core models and all walkforward jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,json,time
          for i in range(350):
              states=[]
              for run in (40053833992,40054087951):
                  j=json.loads(subprocess.run(["gh","api",f"repos/yuhevita-wq/keirin/actions/runs/{run}"],capture_output=True,check=True).stdout)
                  if j["status"]=="completed" and j["conclusion"]!="success":
                      raise SystemExit(f"Required source job {run} failed; no substitute predictions allowed.")
                  states.append(j["status"]=="completed")
              if all(states):break
              print("Waiting for genuine trained original inputs",flush=True)
              time.sleep(30)
          else:raise SystemExit("Required real inputs not ready within wait budget")
          PY
  prepare:
    needs: await-original-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuhevita-wq/kiseki
          ref: 61e9f6b4a2490a551bafc238e5cb44906676468b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r keirin/requirements_vps_slim.txt python-dotenv scikit-learn==1.7.2
      - uses: actions/download-artifact@v4
        with:
          name: nyanta-original-features-40054087951
          run-id: 40054087951
          github-token: ${{ github.token }}
          path: features
      - uses: actions/download-artifact@v4
        with:
          pattern: nyanta-wf-*-40054087951
          run-id: 40054087951
          github-token: ${{ github.token }}
          path: wf
      - uses: actions/download-artifact@v4
        with:
          pattern: nyanta-original-input-*-40053833992
          run-id: 40053833992
          github-token: ${{ github.token }}
          path: core-models
      - name: Read verified original corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download nyanta-verified-checkpoint-40052323240 --repo yuhevita-wq/keirin --dir checkpoint
      - name: Assemble actual past predictions and real final odds
        env:
          COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: python -u keirin/scripts/reconstruct_odds.py prepare --checkpoint checkpoint/nyanta-core.sqlite.gpg --manifest checkpoint/nyanta-core.sqlite.manifest.json --features features/original-features.pkl.gpg --wf-caches wf --core-models core-models --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyanta-real-odds-inputs-${{ github.run_id }}
          path: |
            results/*.gpg
            results/*.json
          if-no-files-found: warn
          compression-level: 0
      - name: Preserve real odds-training input checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nyanta-real-odds-inputs-${{ github.run_id }}"
          gh release create "$tag" --repo yuhevita-wq/keirin --title "$tag" --notes "Genuine original WF predictions, frozen <=2025 core predictions for 2026, actual archived final trifecta odds. No provisional probabilities."
          gh release upload "$tag" results/*.gpg results/*.json --repo yuhevita-wq/keirin
  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        n_car: [7,9]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuhevita-wq/kiseki
          ref: 61e9f6b4a2490a551bafc238e5cb44906676468b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r keirin/requirements_vps_slim.txt python-dotenv scikit-learn==1.7.2
      - uses: actions/download-artifact@v4
        with:
          name: nyanta-real-odds-inputs-${{ github.run_id }}
          path: checkpoint
      - name: Unchanged original odds trainer and hyperparameters
        env:
          COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
        run: python -u keirin/scripts/reconstruct_odds.py train --checkpoint checkpoint/odds-input.sqlite.gpg --predictions checkpoint/original-wf-inputs.tar.gpg --n-car ${{ matrix.n_car }} --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyanta-odds-tf-n${{ matrix.n_car }}-${{ github.run_id }}
          path: |
            results/*.gpg
            results/*.json
          if-no-files-found: warn
      - name: Save original trained odds model and real error metrics
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nyanta-odds-tf-n${{ matrix.n_car }}-${{ github.run_id }}"
          gh release create "$tag" --repo yuhevita-wq/keirin --title "$tag" --notes "Unchanged original train_odds_prediction_tf.py; actual real-data learned model and original metric definitions."
          gh release upload "$tag" results/*.gpg results/*.json --repo yuhevita-wq/keirin
