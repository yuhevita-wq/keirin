name: Nyanta original cup metadata
on:
  push:
    branches: [rebuild/nyanta-data-audit]
    paths: [.github/workflows/nyanta-cup-metadata.yml]
permissions:
  contents: write
env:
  KEIRIN_ALLOW_SQLITE_FALLBACK: "1"
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuhevita-wq/kiseki
          ref: 9b369648eb0d013bc0a6cde46aa864d9252971e6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pandas==2.2.1 numpy==1.26.4
      - name: Read verified existing corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download nyanta-verified-checkpoint-40052323240 --repo yuhevita-wq/keirin --pattern nyanta-core.sqlite.gpg --dir checkpoint
      - name: Read only missing actual cup grade/name once per cup
        env:
          COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
        run: python -u keirin/scripts/reconstruct_cup_metadata.py --checkpoint checkpoint/nyanta-core.sqlite.gpg --shard ${{ matrix.shard }} --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyanta-cup-metadata-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            results/*.gpg
            results/*.summary.json
          if-no-files-found: warn
      - name: Preserve encrypted actual cup metadata and measured completion state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G "results/*.gpg" >/dev/null; then
            tag="nyanta-cup-metadata-${{ matrix.shard }}-${{ github.run_id }}"
            gh release create "$tag" --repo yuhevita-wq/keirin --title "$tag" --notes "Actual missing cup grade/name through original parser. Entries, results and odds are not overwritten. Summary records missing cups explicitly."
            gh release upload "$tag" results/*.gpg results/*.summary.json --repo yuhevita-wq/keirin
          fi
