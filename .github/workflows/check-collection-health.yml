name: Check High-Speed Collection Health
on:
  push:
    paths:
      - ".github/workflows/check-collection-health.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing Actions runs and small collection reports
        run: python scripts/inspect_collection_health.py
      - name: Save non-sensitive results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/high_speed_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record observed high-speed collection health"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
